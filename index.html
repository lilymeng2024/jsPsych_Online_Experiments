<!-- enter javascript code -->
<script type="text/javascript">
/* Note this is a js (javascript) code chunk */


// #######################################
//  set up experiment parameters
// #######################################

//set up timeline
var timeline = [];

// Create unique identifier for subject (random string of letters/numbers X digits long)
var subject_id = jsPsych.randomization.randomID(15); // #FIREBASE

/*define welcome message trial*/
var welcome = {
  type : "html-keyboard-response",
  stimulus: "Welcome to the experiment. Press any key to begin."
};
timeline.push(welcome);

// set up instructions screen (including attention check)
var instructions = {
  type: "html-keyboard-response", // specify jsPsych plugin
  stimulus: `
  <p>In this experiment, a circle will appear in the center 
  of the screen.</p><p>If the circle is <strong>blue</strong>, 
  press the letter F on the keyboard as fast as you can.</p>
  <p>If the circle is <strong>orange</strong>, press the letter J 
  as fast as you can.</p>
  <div style='width: 700px;'>
  <div style='float: left;'><img src='img/blue.png'></img>
  <p class='small'><strong>Press the F key</strong></p></div>
  <div style='float: right;'><img src='img/orange.png'></img>
  <p class='small'><strong>Press the J key</strong></p></div>
  </div>
  <p>Press any key to begin.</p>
  `,
  data: {"phase": "Instructions"}, 
  post_trial_gap:2000// record the phase
};
timeline.push(instructions);

//define trial stimuli array for timeline variables
//add a correct response property and value to each stimuli
var test_stimuli = [
  {stimulus: "img/blue.png", correct_response:'f'},
  {stimulus: "img/orange.png", correct_response:'j'}
];

//add fixation cross in between trials 
//randomize the duration of fixation cross
var fixation = {
  type: "html-keyboard-response", // call for a keyboard response trial
  stimulus: '<div style="font-size:60px;">+</div',
  choices: [], // give no choices for response
  trial_duration: function (){
    return jsPsych.randomization.sampleWithoutReplacement ([250, 500, 750, 1000, 1250, 1500, 1750, 2000],1)[0];
  },
  data: {
    task:'fixation'
  }, // record the phase
};

// define test trials
var test = {
    type: "image-keyboard-response",
    stimulus: jsPsych.timelineVariable('stimulus'),
    choices: ['f','j'],
    data: {
        task: 'response',
        correct_response: jsPsych.timelineVariable('correct_response')
    },
    on_finish: function (data){
        data.correct = jsPsych.pluginAPI.compareKeys (data.response, data.correct_response);
    }
};

//link test_stimuli with the call to jsPsych.timelineVariable('stimulus') defined in the test trials code above
var test_procedure = {
  timeline: [fixation, test],
  timeline_variables:test_stimuli,
  repetitions: 5,
  randomize_order: true
};
timeline.push(test_procedure);

/* tell participant their accuracy and their mean response time for correct responses*/ 
var debrief_block = {
    type: "html-keyboard-response",
    stimulus: function() {
        /*jsPsych.data.get() returns a data collect containing all the data from the experiment*/
        /* .filter() to select the trials where the data property is response, i.e., trials with imgaes shown*/ 
        var trials = jsPsych.data.get().filter({task:'response'});
        /*select trials where property is correct to get the correct trials */ 
        var correct_trials = trials.filter({correct:true});
        /*.count() to count how many trials are correct */
        var accuracy = Math.round(correct_trials.count()/trials.count()*100);
        /*select the rt (resonse time) property of the correct_trials data*/
        /*calculate the mean response time on correct trials*/
        var rt = Math.round (correct_trials.select('rt').mean());

        return `
        <p>You responded correctly on ${accuracy}% of the trials.</p>
        <p>Your average response time was ${rt}ms.</p>
        <p>Press any key to complete the experiment. Thank you! </p>`;
    }
};
timeline.push(debrief_block);

/*start experiment*/
jsPsych.init({
    timeline: timeline,
    on_finish: function() {
      var experimentData = jsPsych.data.get().json(); // Get the data in JSON format
      database.ref('experiments/' + subject_id).set(experimentData) // Push to Firebase
          .then(function() {
              console.log("Data saved successfully!");
          })
          .catch(function(error) {
              console.error("Error saving data: ", error);
          });
      jsPsych.data.displayData();
    }
});
</script>
